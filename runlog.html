<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Morning brief run log</title>
<link rel="icon" type="image/svg+xml" href="__FAVICON__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<!-- Rendered from runlog.html by runlog.py; the data is index.json and runs/<id>.json next to this page. -->
<style>
:root {
  --ground: #F3F5F9; --surface: #FFFFFF; --surface-2: #EEF1F7; --ink: #141A26; --muted: #5D6679; --faint: #8A93A6;
  --rule: #DCE1EA; --accent: #2F4BCF; --up: #177A47; --down: #BD3434; --warn-bg: #FFF1D6; --warn-ink: #8A5300; --rail: #E3E7EF;
  --s-script: #2a78d6; --s-agent: #eb6834; --s-sub: #1baf7a;
  --display: "Bricolage Grotesque", "Schibsted Grotesk", system-ui, sans-serif;
  --body: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0D111A; --surface: #141A25; --surface-2: #1A2130; --ink: #E7EAF1; --muted: #9AA3B5; --faint: #6E7789;
    --rule: #262E3D; --accent: #8CA0FF; --up: #4FC98C; --down: #F27A7A; --warn-bg: #3A2A0B; --warn-ink: #F5C165; --rail: #232B3A;
    --s-script: #3987e5; --s-agent: #d95926; --s-sub: #199e70;
  }
}
:root[data-theme="dark"] {
  --ground: #0D111A; --surface: #141A25; --surface-2: #1A2130; --ink: #E7EAF1; --muted: #9AA3B5; --faint: #6E7789;
  --rule: #262E3D; --accent: #8CA0FF; --up: #4FC98C; --down: #F27A7A; --warn-bg: #3A2A0B; --warn-ink: #F5C165; --rail: #232B3A;
  --s-script: #3987e5; --s-agent: #d95926; --s-sub: #199e70;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 40px 28px 64px; display: grid; gap: 36px; }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--accent); }
a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.mono, td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 32px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.eyebrow a { color: var(--accent); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 4vw, 42px); line-height: 1.05; letter-spacing: -.02em; margin: 6px 0 0; }
.lede { margin: 10px 0 0; color: var(--muted); max-width: 64ch; }
.stamp { font-family: var(--mono); font-size: 12.5px; color: var(--muted); text-align: right; line-height: 1.6; }
h2 { font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: -.01em; margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
h3 { font-family: var(--display); font-size: 17px; font-weight: 600; margin: 0; }
section { display: grid; gap: 14px; min-width: 0; }
.sec-note { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 90ch; }

.table-box { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 12px 14px 9px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; font-size: 14px; }
tr:last-child td { border-bottom: 0; }
th.num, td.num { text-align: right; white-space: nowrap; }
td.num { font-size: 13.5px; }
tbody tr:hover td { background: var(--surface-2); }
table.runs { min-width: 860px; }
table.runs tr.sel td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
table.runs tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
table.runs td.when { white-space: nowrap; }
table.runs td.when a { font-weight: 600; }
table.runs td.sum { color: var(--muted); max-width: 46ch; }
table.stages { min-width: 900px; }
table.jobs { min-width: 900px; }
td.result { color: var(--muted); max-width: 52ch; }
td.me { white-space: nowrap; }

.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 12px var(--body); padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--up); } .pill.failed { color: var(--down); } .pill.running { color: var(--accent); }
.pill.partial, .pill.warn, .pill.unfinished { color: var(--warn-ink); background: var(--warn-bg); border-color: transparent; }
.pill.skipped { color: var(--muted); }
.by { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.sw.script { background: var(--s-script); } .sw.agent { background: var(--s-agent); } .sw.subagents { background: var(--s-sub); }

.summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); }
.stat { padding: 14px 18px 16px 0; display: grid; gap: 3px; align-content: start; min-width: 0; }
.stat + .stat { padding-left: 18px; border-left: 1px solid var(--rule); }
.stat .k { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stat .v { font-family: var(--mono); font-size: 23px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .s { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.stat.hot { background: var(--surface-2); padding-left: 18px; }

.notice { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
.notice b { font-weight: 600; }

.chart-box { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 16px 10px; display: grid; gap: 10px; }
.chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 20px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
svg.usage { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
svg.usage .grid line { stroke: var(--rule); stroke-width: 1; }
svg.usage text { fill: var(--muted); font: 11.5px var(--mono); }
svg.usage .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.usage .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
svg.usage .cross { stroke: var(--muted); stroke-width: 1; visibility: hidden; }
svg.usage .ring { fill: var(--surface); stroke: var(--accent); stroke-width: 2; visibility: hidden; }
svg.usage.on .cross, svg.usage.on .ring { visibility: visible; }

.gantt { display: grid; gap: 2px; }
.g-row { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr) 4.5rem; align-items: center; gap: 12px; padding: 4px 0; border-radius: 4px; cursor: default; }
.g-row:hover { background: var(--surface-2); }
.g-name { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-track { position: relative; height: 14px; background: var(--rail); border-radius: 3px; }
.g-bar { position: absolute; top: 0; bottom: 0; min-width: 3px; border-radius: 3px; }
.g-bar.script { background: var(--s-script); } .g-bar.agent { background: var(--s-agent); } .g-bar.subagents { background: var(--s-sub); }
.g-bar.open { background-image: repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in srgb, var(--surface) 55%, transparent) 4px 7px); }
.g-dur { font: 12.5px var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.g-axis { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr) 4.5rem; gap: 12px; font: 11.5px var(--mono); color: var(--muted); }
.g-axis div:nth-child(2) { display: flex; justify-content: space-between; }

details.more summary { cursor: pointer; font-weight: 500; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: " ▸"; color: var(--faint); font-size: 12px; }
details.more[open] summary::after { content: " ▾"; }
.more-body { margin-top: 8px; display: grid; gap: 6px; font-size: 13px; color: var(--muted); max-width: 80ch; }
.more-body code, pre { font-family: var(--mono); font-size: 12px; }
pre { margin: 0; padding: 8px 10px; background: var(--surface-2); border-radius: 6px; white-space: pre-wrap; word-break: break-word; color: var(--ink); max-height: 22em; overflow: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 8px; }
.chip { font: 12px var(--mono); padding: 1px 7px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--rule); color: var(--ink); }

.minibar { display: inline-block; vertical-align: middle; width: 56px; height: 6px; background: var(--rail); border-radius: 2px; margin-right: 8px; position: relative; }
.minibar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--s-sub); border-radius: 2px; }
.group-head { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13.5px; color: var(--muted); }
.group-head b { font-family: var(--mono); font-weight: 500; color: var(--ink); }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 32px; }
ul.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
ul.notes li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 14px; }
dl.kv { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; font-size: 14px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
dl.kv dd a { color: var(--accent); }
.empty { color: var(--muted); font-size: 14px; }

#tip { position: fixed; z-index: 10; pointer-events: none; transform: translate(-50%, calc(-100% - 12px)); background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 9px; font: 12px/1.45 var(--mono); font-variant-numeric: tabular-nums; box-shadow: 0 2px 10px rgb(0 0 0 / .14); max-width: min(320px, calc(100vw - 24px)); }
#tip .t { color: var(--muted); }
#tip b { font-family: var(--body); font-weight: 600; font-size: 12.5px; }

@media (max-width: 820px) {
  .wrap { padding: 28px 16px 48px; gap: 30px; }
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat, .stat + .stat { padding: 12px 12px 12px 0; border-left: 0; border-bottom: 1px solid var(--rule); }
  .stat.hot { padding-left: 12px; grid-column: 1 / -1; order: -1; }
  .stamp { text-align: left; }
  .g-row, .g-axis { grid-template-columns: minmax(0, 1fr) 4rem; gap: 2px 10px; }
  .g-name { grid-column: 1 / -1; }
  .g-axis div:first-child { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow"><a href="../">Morning brief</a> · <a href="../hunt/">Mispricing hunt</a></div>
      <h1>Run log</h1>
      <p class="lede">Every run of the daily routine: the stages and sub-jobs it ran, which model and effort level ran each one, how long it took, and how much of the weekly Claude plan was left along the way.</p>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>
  <section id="runs" aria-label="Runs"><p class="empty">Loading…</p></section>
  <div id="run" style="display:grid;gap:36px"></div>
</div>
<div id="tip" hidden></div>
<script>
(() => {
  const TZ = 'Europe/Copenhagen';
  const fTime = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: TZ });
  const fSec = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: TZ });
  const fDay = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: TZ });
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const T = s => new Date(s).getTime();
  const day = s => s ? fDay.format(T(s)) : '—';
  const hm = s => s ? fTime.format(T(s)) : '—';
  const dur = s => s == null ? '—' : s < 60 ? `${Math.round(s)}s` : s < 3600 ? `${Math.floor(s / 60)}m ${String(Math.round(s % 60)).padStart(2, '0')}s` : `${Math.floor(s / 3600)}h ${String(Math.round(s % 3600 / 60)).padStart(2, '0')}m`;
  const pct = v => v == null ? '—' : `${(Math.round(v * 10) / 10).toFixed(Number.isInteger(Math.round(v * 10) / 10) ? 0 : 1)}%`;
  const left = u => u == null ? null : Math.max(0, 100 - u);
  const pp = d => d == null ? '—' : Math.abs(d) < 0.05 ? '±0 pp' : `${d > 0 ? '+' : '−'}${Math.abs(d).toFixed(1)} pp`;
  const int = n => n == null ? '—' : Math.round(n).toLocaleString('en-GB');
  const ktok = n => n == null ? '—' : n >= 1e6 ? `${(n / 1e6).toFixed(2)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n);
  const MODELS = { 'claude-opus-5-5': 'Opus 5.5', 'claude-sonnet-5-5': 'Sonnet 5.5', 'claude-haiku-5-5': 'Haiku 5.5', 'claude-fable-5-1': 'Fable 5.1', opus: 'Opus', sonnet: 'Sonnet', haiku: 'Haiku', fable: 'Fable' };
  const model = m => MODELS[m] || m || '—';
  const me = (m, e) => m || e ? `${esc(model(m))}${e ? ` · ${esc(e)}` : ''}` : '<span class="muted">—</span>';
  const BY = { script: 'Script', agent: 'Main agent', subagents: 'Subagents' };
  const ICON = { ok: '✓', failed: '✕', running: '●', partial: '!', warn: '!', unfinished: '!', skipped: '–' };
  const pill = s => `<span class="pill ${esc(s)}">${ICON[s] || ''} ${esc(s)}</span>`;
  const used = (cp, k = 'weekly') => cp?.windows?.[k]?.used;
  const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length ? (s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2) : null; };
  const runsEl = document.getElementById('runs'), runEl = document.getElementById('run'), tip = document.getElementById('tip');
  let INDEX = null;

  const showTip = (html, x, y) => { tip.innerHTML = html; tip.style.left = `${Math.min(Math.max(x, 140), innerWidth - 140)}px`; tip.style.top = `${y}px`; tip.hidden = false; };
  const hideTip = () => { tip.hidden = true; };
  addEventListener('scroll', hideTip, { passive: true });

  function renderRuns(idx, sel) {
    const rows = idx.runs.map(r => {
      const [w0, w1] = r.weekly || [];
      return `<tr class="${r.id === sel ? 'sel' : ''}">
        <td class="when">${r.detail ? `<a href="#${esc(r.id)}">${esc(day(r.started))}, ${esc(hm(r.started))}</a>` : `${esc(day(r.started))}, ${esc(hm(r.started))}`}</td>
        <td>${pill(r.status)}</td>
        <td class="num">${esc(dur(r.seconds))}</td>
        <td class="num">${esc(pct(left(w0)))} → ${esc(pct(left(w1)))}</td>
        <td class="num">${esc(w0 != null && w1 != null ? pp(w1 - w0) : '—')}</td>
        <td class="me">${me(r.model, r.effort)}</td>
        <td class="num">${int(r.jobs)}</td>
        <td class="sum">${esc(r.summary || '')}${r.warnings ? ` <span class="pill warn">! ${r.warnings}</span>` : ''}</td>
      </tr>`;
    }).join('');
    runsEl.innerHTML = `<h2>Runs</h2>
      <div class="table-box"><table class="runs"><thead><tr><th>Started</th><th>Status</th><th class="num">Time</th><th class="num">Weekly plan left</th><th class="num">Used</th><th>Main agent</th><th class="num">Sub-jobs</th><th>Summary</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="8" class="empty">No runs logged yet.</td></tr>'}</tbody></table></div>
      <p class="sec-note">Weekly plan left is 100% minus the account's 7-day usage (all models) at the start and end of the run; Used is the difference, in percentage points of the weekly limit. Runs older than the last 30 keep only this summary.</p>`;
  }

  function usageChart(r, cps) {
    const pts = cps.filter(c => used(c) != null);
    if (!pts.length) return '';
    const t0 = T(r.started), t1 = Math.max(T(r.ended || pts[pts.length - 1].at), t0 + 60e3, ...pts.map(c => T(c.at)));
    const vals = pts.map(c => left(used(c)));
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (hi - lo < 2) { const m = (hi + lo) / 2; lo = m - 1; hi = m + 1; }
    lo = Math.max(0, Math.floor(lo - 0.5)); hi = Math.min(100, Math.ceil(hi + 0.5));
    const W = 720, H = 190, L = 48, R = 14, TOP = 10, B = 26;
    const x = t => L + (T(t) - t0) / (t1 - t0) * (W - L - R), y = v => TOP + (hi - v) / (hi - lo) * (H - TOP - B);
    const ticks = [lo, (lo + hi) / 2, hi];
    const xt = [t0, t0 + (t1 - t0) / 2, t1];
    const xy = pts.map(c => [x(c.at), y(left(used(c)))]);
    return `<div class="chart-box">
      <div class="chart-head"><h3>Weekly plan left during the run</h3><span class="legend">${pts.length} readings · axis from ${pct(lo)} to ${pct(hi)}</span></div>
      <svg class="usage" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly plan left, from ${pct(vals[0])} at the start to ${pct(vals[vals.length - 1])} at the last reading">
        <g class="grid">${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${pct(v)}</text>`).join('')}</g>
        ${xt.map((t, i) => `<text x="${L + i / 2 * (W - L - R)}" y="${H - 6}" text-anchor="${['start', 'middle', 'end'][i]}">${fTime.format(t)}</text>`).join('')}
        <polyline class="line" points="${xy.map(p => p.join(',')).join(' ')}"/>
        ${xy.map(p => `<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="4"/>`).join('')}
        <line class="cross" y1="${TOP}" y2="${H - B}"/><circle class="ring" r="5"/>
        <rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent" data-hit="1"/>
      </svg></div>`;
  }

  function wireUsage(svg, pts) {
    if (!svg) return;
    const xy = [...svg.querySelectorAll('circle.dot')].map(c => [+c.getAttribute('cx'), +c.getAttribute('cy')]);
    const cross = svg.querySelector('.cross'), ring = svg.querySelector('.ring'), W = svg.viewBox.baseVal.width;
    const move = e => {
      const b = svg.getBoundingClientRect(), px = (e.clientX - b.left) / b.width * W;
      let i = 0; xy.forEach((p, j) => { if (Math.abs(p[0] - px) < Math.abs(xy[i][0] - px)) i = j; });
      cross.setAttribute('x1', xy[i][0]); cross.setAttribute('x2', xy[i][0]); ring.setAttribute('cx', xy[i][0]); ring.setAttribute('cy', xy[i][1]);
      svg.classList.add('on');
      const c = pts[i], f = used(c, 'five_hour');
      showTip(`<b>${esc(c.label)}</b><br><span class="t">${esc(fSec.format(T(c.at)))}</span><br>weekly left ${esc(pct(left(used(c))))}${f != null ? `<br>5-hour left ${esc(pct(left(f)))}` : ''}`,
        b.left + xy[i][0] / W * b.width, b.top + xy[i][1] / svg.viewBox.baseVal.height * b.height);
    };
    svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move);
    svg.addEventListener('pointerleave', () => { svg.classList.remove('on'); hideTip(); });
  }

  function stageDelta(r, s) {
    const a = used(r.checkpoints[s.cp_start]), b = used(r.checkpoints[s.cp_end]);
    return a != null && b != null ? b - a : null;
  }

  function gantt(r) {
    if (!r.stages.length) return '';
    const t0 = T(r.started), t1 = Math.max(T(r.ended || new Date().toISOString()), t0 + 1000, ...r.stages.map(s => T(s.ended || s.started)));
    const rows = r.stages.map((s, i) => {
      const a = (T(s.started) - t0) / (t1 - t0) * 100, b = (T(s.ended || r.ended || new Date(t1).toISOString()) - T(s.started)) / (t1 - t0) * 100;
      return `<div class="g-row" data-i="${i}"><div class="g-name">${esc(s.title)}</div>
        <div class="g-track"><div class="g-bar ${esc(s.by)}${s.ended ? '' : ' open'}" style="left:${a.toFixed(2)}%;width:${Math.max(b, 0).toFixed(2)}%"></div></div>
        <div class="g-dur">${esc(dur(s.seconds))}</div></div>`;
    }).join('');
    return `<div class="chart-box">
      <div class="chart-head"><h3>Where the time went</h3>
        <div class="legend">${Object.entries(BY).map(([k, v]) => `<span><i class="sw ${k}"></i>${v}</span>`).join('')}</div></div>
      <div class="gantt">${rows}
        <div class="g-axis"><div></div><div><span>${esc(hm(new Date(t0).toISOString()))}</span><span>${esc(dur((t1 - t0) / 1000))}</span><span>${esc(hm(new Date(t1).toISOString()))}</span></div><div></div></div>
      </div></div>`;
  }

  function wireGantt(el, r) {
    el.querySelectorAll('.g-row').forEach(row => {
      const s = r.stages[+row.dataset.i], d = stageDelta(r, s);
      const html = `<b>${esc(s.title)}</b><br><span class="t">${esc(fSec.format(T(s.started)))} → ${s.ended ? esc(fSec.format(T(s.ended))) : 'open'}</span><br>${esc(dur(s.seconds))} · ${esc(BY[s.by] || s.by)}${s.model ? ` · ${esc(model(s.model))}${s.effort ? ' ' + esc(s.effort) : ''}` : ''}${d != null ? `<br>weekly used ${esc(pp(d))}` : ''}`;
      const show = e => { const b = row.querySelector('.g-track').getBoundingClientRect(); showTip(html, Math.min(Math.max(e.clientX, b.left), b.right), b.top); };
      row.addEventListener('pointermove', show); row.addEventListener('pointerdown', show); row.addEventListener('pointerleave', hideTip);
    });
  }

  function stageTable(r) {
    const rows = r.stages.map((s, i) => {
      const d = stageDelta(r, s);
      const extra = [
        s.command ? `<div>Command: <code>${esc(s.command)}</code>${s.exit != null ? ` · exit ${esc(s.exit)}` : ''}</div>` : '',
        Object.keys(s.metrics || {}).length ? `<div class="chips">${Object.entries(s.metrics).map(([k, v]) => `<span class="chip">${esc(k)} ${esc(v)}</span>`).join('')}</div>` : '',
        (s.notes || []).map(n => `<div>${esc(n)}</div>`).join(''),
        s.output?.length ? `<pre>${esc(s.output.join('\n'))}</pre>` : '',
      ].join('');
      const name = extra ? `<details class="more" data-k="${i}"><summary>${esc(s.title)}</summary><div class="more-body">${extra}</div></details>` : esc(s.title);
      return `<tr><td>${name}</td><td><span class="by"><i class="sw ${esc(s.by)}"></i>${esc(BY[s.by] || s.by)}</span></td>
        <td class="me">${s.by === 'script' ? '<span class="muted">no model</span>' : me(s.model, s.effort)}</td>
        <td class="num">${esc(s.started ? fSec.format(T(s.started)) : '—')}</td><td class="num">${esc(dur(s.seconds))}</td>
        <td class="num">${esc(pp(d))}</td><td>${pill(s.status)}</td></tr>`;
    }).join('');
    return `<section><h2>Stages</h2>
      <div class="table-box"><table class="stages"><thead><tr><th>Stage</th><th>Run by</th><th>Model · effort</th><th class="num">Started</th><th class="num">Time</th><th class="num">Weekly used</th><th>Status</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="7" class="empty">No stages logged.</td></tr>'}</tbody></table></div>
      <p class="sec-note">Open a stage for its command, exit code, counts, notes and the start and end of its output. Weekly used is the change in 7-day usage between the stage's start and end readings; readings less than 30 seconds apart are shared, so short stages show ±0.</p></section>`;
  }

  function jobsSection(r) {
    if (!r.jobs.length) return '';
    const groups = {};
    r.jobs.forEach(j => (groups[j.stage] ||= []).push(j));
    const maxS = Math.max(...r.jobs.map(j => j.seconds || 0), 1);
    return `<section><h2>Sub-jobs</h2>${Object.entries(groups).map(([key, js]) => {
      const st = [...r.stages].reverse().find(s => s.key === key);
      const t = js.map(j => j.seconds).filter(v => v != null), sum = (k) => js.reduce((a, j) => a + (j[k] || 0), 0);
      const slow = js.reduce((a, j) => (j.seconds || 0) > (a.seconds || 0) ? j : a, js[0]);
      const models = [...new Set(js.map(j => `${model(j.model)}${j.effort ? ' · ' + j.effort : ''}`))].join(', ');
      const written = js.some(j => j.total != null) ? `<span><b>${int(sum('written'))}</b> of <b>${int(sum('total'))}</b> markets written</span>` : '';
      const rows = [...js].sort((a, b) => String(a.name).localeCompare(String(b.name), 'en', { numeric: true })).map(j => `<tr>
        <td class="mono">${esc(j.name)}</td><td class="me">${me(j.model, j.effort)}</td>
        <td class="num"><span class="minibar"><i style="width:${((j.seconds || 0) / maxS * 100).toFixed(1)}%"></i></span>${esc(dur(j.seconds))}</td>
        <td class="num">${esc(ktok(j.tokens))}</td><td class="num">${int(j.tool_uses)}</td><td class="num">${int(j.searches)}</td>
        <td>${j.status === 'ok' ? '' : pill(j.status) + ' '}<span class="result">${esc(j.result)}</span></td></tr>`).join('');
      return `<div style="display:grid;gap:10px"><h3>${esc(st ? st.title : key)}</h3>
        <div class="group-head"><span><b>${js.length}</b> sub-jobs · ${esc(models)}</span>${st ? `<span>stage time <b>${esc(dur(st.seconds))}</b></span>` : ''}
          <span>summed <b>${esc(dur(t.reduce((a, b) => a + b, 0)))}</b></span><span>median <b>${esc(dur(median(t)))}</b></span>
          <span>slowest <b>${esc(slow.name)}</b> ${esc(dur(slow.seconds))}</span><span><b>${esc(ktok(sum('tokens')))}</b> tokens</span>
          <span><b>${int(sum('tool_uses'))}</b> tool uses</span>${js.some(j => j.searches != null) ? `<span><b>${int(sum('searches'))}</b> searches</span>` : ''}${written}</div>
        <div class="table-box"><table class="jobs"><thead><tr><th>Sub-job</th><th>Model · effort</th><th class="num">Time</th><th class="num">Tokens</th><th class="num">Tool uses</th><th class="num">Searches</th><th>Result</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    }).join('')}<p class="sec-note">Time, tokens and tool uses come from each Agent call's own usage report; searches and markets written are from the subagent's reply.</p></section>`;
  }

  function renderRun(r) {
    const cps = r.checkpoints || [];
    const pts = cps.filter(c => used(c) != null);
    const first = pts[0], last = pts[pts.length - 1];
    const w0 = used(first), w1 = used(last), f0 = used(first, 'five_hour'), f1 = used(last, 'five_hour');
    const jt = r.jobs.reduce((a, j) => a + (j.seconds || 0), 0), tok = r.jobs.reduce((a, j) => a + (j.tokens || 0), 0);
    const reset = last?.windows?.weekly?.resets;
    const scoped = Object.keys(last?.windows || {}).filter(k => k.startsWith('weekly_'));
    const notes = [...(r.notes || [])].sort((a, b) => (a.level === 'info') - (b.level === 'info'));
    const metrics = Object.entries(r.metrics || {});
    runEl.innerHTML = `
      <section>
        <h2>Run of ${esc(day(r.started))}, ${esc(hm(r.started))} ${pill(r.status)}</h2>
        ${r.summary ? `<p class="sec-note" style="color:var(--ink);font-size:15px">${esc(r.summary)}</p>` : ''}
        <div class="summary">
          <div class="stat"><span class="k">Time</span><span class="v">${esc(dur(r.seconds))}</span><span class="s">${esc(hm(r.started))} → ${r.ended ? esc(hm(r.ended)) : 'running'}</span></div>
          <div class="stat hot"><span class="k">Weekly plan left</span><span class="v">${esc(pct(left(w1)))}</span><span class="s">${w0 != null ? `start ${esc(pct(left(w0)))} · used ${esc(pp(w1 - w0))}` : 'unavailable'}</span></div>
          <div class="stat"><span class="k">5-hour window left</span><span class="v">${esc(pct(left(f1)))}</span><span class="s">${f0 != null ? `start ${esc(pct(left(f0)))} · used ${esc(pp(f1 - f0))}` : 'unavailable'}</span></div>
          <div class="stat"><span class="k">Main agent</span><span class="v" style="font-size:19px">${esc(model(r.agent.model))}</span><span class="s">effort ${esc(r.agent.effort)}</span></div>
          <div class="stat"><span class="k">Sub-jobs</span><span class="v">${int(r.jobs.length)}</span><span class="s">${esc(dur(jt))} summed · ${esc(ktok(tok))} tokens</span></div>
        </div>
        ${!pts.length ? `<div class="notice"><b>Plan usage was not available in this run.</b> ${esc(r.usage_error || '')}</div>` : ''}
        ${reset || scoped.length ? `<p class="sec-note">${reset ? `The weekly limit resets ${esc(day(reset))}, ${esc(hm(reset))}.` : ''} ${scoped.map(k => `${esc(k.slice(7).replace(/_/g, ' '))} weekly: ${esc(pct(left(used(last, k))))} left`).join(' · ')}</p>` : ''}
        ${usageChart(r, cps)}
        ${gantt(r)}
      </section>
      ${stageTable(r)}
      ${jobsSection(r)}
      <div class="two">
        <section><h2>Notes</h2>${notes.length ? `<ul class="notes">${notes.map(n => `<li><span class="pill ${n.level === 'info' ? 'skipped' : n.level === 'warn' ? 'warn' : 'failed'}">${n.level === 'info' ? 'i' : '!'} ${esc(n.level)}</span><span>${esc(n.text)} <span class="muted mono" style="font-size:12px">${esc(hm(n.at))}</span></span></li>`).join('')}</ul>` : '<p class="empty">No notes.</p>'}
          ${metrics.length ? `<h3 style="margin-top:8px">Run facts</h3><div class="chips">${metrics.map(([k, v]) => `<span class="chip">${esc(k)} ${esc(v)}</span>`).join('')}</div>` : ''}</section>
        <section><h2>Environment</h2><dl class="kv">
          <dt>Runner</dt><dd>${esc(r.env?.runner)}</dd>
          <dt>Code</dt><dd>${esc(r.env?.branch)} @ ${esc(r.env?.commit)}</dd>
          ${r.env?.session ? `<dt>Session</dt><dd><a href="${esc(r.env.session)}">${esc(r.env.session.replace('https://', ''))}</a></dd>` : ''}
          <dt>Model and effort</dt><dd>${esc(r.agent.source)}</dd>
          <dt>Plan usage</dt><dd>${esc(r.usage_source || 'unavailable')}</dd>
          <dt>Run id</dt><dd>${esc(r.id)}</dd>
        </dl></section>
      </div>`;
    wireUsage(runEl.querySelector('svg.usage'), pts);
    const g = runEl.querySelector('.gantt'); if (g) wireGantt(g, r);
  }

  // While the run on screen is still going, re-read the log every minute; the routine republishes it as it goes.
  let timer = null, shownId = null;
  const stamp = () => {
    const live = INDEX.runs[0]?.status === 'running';
    document.getElementById('stamp').innerHTML = INDEX.updated ? `Updated ${esc(day(INDEX.updated))}, ${esc(hm(INDEX.updated))}<br>${INDEX.runs.length} runs logged${live ? '<br>A run is going: this page refreshes every minute' : ''}` : '';
  };

  async function show() {
    clearTimeout(timer);
    const id = decodeURIComponent(location.hash.slice(1)) || INDEX.runs.find(r => r.detail)?.id;
    renderRuns(INDEX, id);
    if (!id) { runEl.innerHTML = ''; return; }
    try {
      const r = await (await fetch(`runs/${encodeURIComponent(id)}.json?v=${encodeURIComponent(INDEX.updated || '')}`)).json();
      const open = id === shownId ? [...runEl.querySelectorAll('details[open][data-k]')].map(d => d.dataset.k) : [];
      renderRun(r);
      shownId = id;
      open.forEach(k => runEl.querySelector(`details[data-k="${k}"]`)?.setAttribute('open', ''));
      if (r.status === 'running') timer = setTimeout(refresh, 60000);
    } catch (e) { runEl.innerHTML = `<p class="empty">The full log of this run is not kept any more.</p>`; }
  }

  async function refresh() {
    try { INDEX = await (await fetch(`index.json?t=${Date.now()}`)).json(); stamp(); } catch (e) { /* keep what is on screen */ }
    hideTip();
    show();
  }

  fetch(`index.json?t=${Date.now()}`).then(r => r.json()).then(idx => {
    INDEX = idx;
    stamp();
    addEventListener('hashchange', show);
    show();
  }).catch(() => { runsEl.innerHTML = '<p class="empty">No run log has been published yet.</p>'; });
})();
</script>
</body>
</html>
